# MSD-Net: Morphology-Structure-Detail Network for NEU-DET
# Backbone is identical to YOLO11n (official yolo11n.pt weights are reusable).
# Neck / fusion / head are rebuilt from brand-new MSD operators:
#   GAF = Gradient-Aware Fusion, HPD = High-frequency Preserving Downsample,
#   MBlock = CSP block with Differentiable Morphology Filter (DMF),
#   LiteDetect = 1x1 decoupled head.
nc: 6
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4  lateral P3
  - [-1, 1, Conv, [512, 3, 2]] # 5  P4/16
  - [-1, 2, C3k2, [512, True]] # 6  lateral P4
  - [-1, 1, Conv, [1024, 3, 2]] # 7  P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 lateral P5

head:
  # ---- top-down pathway: GAF gradient-aware fusion ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12  256+128
  - [-1, 1, GAF, [512]] # 13  -> P4 fused (128)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15  128+128
  - [-1, 1, MBlock, [256]] # 16  -> P3 out (64)
  # ---- bottom-up pathway: HPD high-frequency preserving downsample ----
  - [-1, 1, HPD, [256, 3, 2]] # 17  P3 -> P4
  - [[-1, 13], 1, Concat, [1]] # 18  64+128
  - [-1, 1, GAF, [512]] # 19  -> P4 out (128)
  - [-1, 1, HPD, [512, 3, 2]] # 20  P4 -> P5
  - [[-1, 10], 1, Concat, [1]] # 21  128+256
  - [-1, 1, GAF, [1024]] # 22  -> P5 out (256)
  - [[16, 19, 22], 1, LiteDetect, [nc]] # 23  Detect(P3,P4,P5)
