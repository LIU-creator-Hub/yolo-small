nc: 6
scales:
  # [depth, width, max_channels] 限制深层特征维度最大为 512
  n: [0.50, 0.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0‑P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1‑P2/4
  - [-1, 2, C3_PDSM, [256, False, 0.25]] # 2 替换C3k2，C3_PDSM(c2, shortcut, e)
  - [-1, 1, Conv, [256, 3, 2]] # 3‑P3/8 替换 MADown
  - [-1, 2, C3_PDSM, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5‑P4/16 替换 MADown
  - [-1, 2, C3_PDSM, [512, True]] # 6 shortcut=True主干开启残差
  - [-1, 1, Conv, [1024, 3, 2]] # 7‑P5/32 替换 MADown
  - [-1, 2, C3_PDSM, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C3k2, [1024]] #10 替换 C2PSA，head侧保持原生

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #11
  - [[-1, 6], 1, Concat, [1]] #12
  - [-1, 2, C3k2, [512]] #13 原生

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #14
  - [[-1, 4], 1, Concat, [1]] #15
  - [-1, 2, C3k2, [256]] #16 原生

  - [-1, 1, Conv, [256, 3, 2]] #17 替换 MADown
  - [[-1, 13], 1, Concat, [1]] #18
  - [-1, 2, C3k2, [512]] #19 原生

  - [-1, 1, Conv, [512, 3, 2]] #20 替换 MADown
  - [[-1, 10], 1, Concat, [1]] #21
  - [-1, 2, C3k2, [1024]] #22 原生

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3,P4,P5)
